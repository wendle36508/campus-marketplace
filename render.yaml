# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Render asks for each value marked "sync: false" once, privately.
services:
  - type: web
    name: campus-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_NAME
        value: "[APP NAME]"
      # Render's own Postgres, created by this Blueprint (see databases below)
      - key: DATABASE_URL
        fromDatabase:
          name: campus-marketplace-db
          property: connectionString
      # AI pricing runs in demo mode (sample prices) until you add an
      # ANTHROPIC_API_KEY in the Render dashboard under Environment.
      # Prototype mode: no verification emails. The 6-digit code is shown on
      # screen after entering a @babson.edu address. To send real emails later,
      # set EMAIL_PROVIDER=brevo, DEV_SHOW_CODES=false, and add BREVO_API_KEY
      # and EMAIL_FROM (see README "Email sending").
      - key: EMAIL_PROVIDER
        value: console
      - key: DEV_SHOW_CODES
        value: "true"
      # Your own @babson.edu email(s), comma separated, to get the admin dashboard
      - key: ADMIN_EMAILS
        sync: false
      # Set to "false" to launch with no demo listings
      - key: SEED_DEMO_DATA
        value: "true"

# Free Render Postgres. Render's free databases expire after 30 days; upgrade
# it in the Render dashboard, or point DATABASE_URL at Neon/Supabase instead.
databases:
  - name: campus-marketplace-db
    plan: free
    databaseName: marketplace
    user: marketplace
