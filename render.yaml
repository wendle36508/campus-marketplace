# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Render asks for each value marked "sync: false" once, privately.
services:
  - type: web
    name: campus-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_NAME
        value: "[APP NAME]"
      # Postgres connection string from Neon (or any Postgres)
      - key: DATABASE_URL
        sync: false
      # Claude API key for photo price suggestions
      - key: ANTHROPIC_API_KEY
        sync: false
      # Verification emails via Brevo's API. (Render's free plan blocks
      # outgoing SMTP, so Gmail SMTP only works on a paid plan.)
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      # The sender you verified in Brevo, e.g. "[APP NAME] <yourapp@gmail.com>"
      - key: EMAIL_FROM
        sync: false
      # Your own @babson.edu email(s), comma separated, to get the admin dashboard
      - key: ADMIN_EMAILS
        sync: false
      # Set to "false" to launch with no demo listings
      - key: SEED_DEMO_DATA
        value: "true"
