# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Render asks for each value marked "sync: false" once, privately.
services:
  - type: web
    name: campus-marketplace
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_NAME
        value: "[APP NAME]"
      # Render's own Postgres, created by this Blueprint (see databases below)
      - key: DATABASE_URL
        fromDatabase:
          name: campus-marketplace-db
          property: connectionString
      # AI pricing runs in demo mode (sample prices) until you add an
      # ANTHROPIC_API_KEY in the Render dashboard under Environment.
      # No email service yet: sign-in codes are written to Render's Logs only,
      # never shown on screen. To email codes, set EMAIL_PROVIDER=brevo and add
      # BREVO_API_KEY and EMAIL_FROM (see README "Email sending").
      # The server refuses to start in production if DEV_SHOW_CODES is true.
      - key: EMAIL_PROVIDER
        value: console
      - key: DEV_SHOW_CODES
        value: "false"
      # Your own @babson.edu email(s), comma separated, to get the admin dashboard
      - key: ADMIN_EMAILS
        sync: false
      # Demo listings are for local demos only. The server refuses to start in
      # production if this is true.
      - key: SEED_DEMO_DATA
        value: "false"

# Render Postgres (paid, so it doesn't expire and can be backed up).
databases:
  - name: campus-marketplace-db
    plan: 0.1c-256mb
    databaseName: marketplace
    user: marketplace
